<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SEO. El marcador de dominio de las URLs absolutas lo reemplaza
      vite.config.ts con VITE_SITE_URL (dominio de producción). Título, descripción y canonical se
      actualizan por ruta desde src/router/seo.ts.
    -->
    <title>Barber Creiizii | Barbería en Medellín – Cortes, barba y estilo</title>
    <meta
      name="description"
      content="Barbería premium en Aures II, Medellín. Cortes de cabello, arreglo de barba y estilo para caballeros. Reserva tu cita en línea en segundos."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Barber Creiizii" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Íconos -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Ubicación -->
    <meta name="geo.region" content="CO-ANT" />
    <meta name="geo.placename" content="Medellín" />

    <!-- Open Graph (WhatsApp, Facebook, Instagram, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="Barber Creiizii" />
    <meta property="og:title" content="Barber Creiizii | Barbería en Medellín" />
    <meta
      property="og:description"
      content="Cortes de cabello, arreglo de barba y estilo en Aures II, Medellín. Reserva tu cita en línea."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/logo.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="643" />
    <meta property="og:image:height" content="487" />
    <meta property="og:image:alt" content="Logo de Barber Creiizii" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Barber Creiizii | Barbería en Medellín" />
    <meta
      name="twitter:description"
      content="Cortes de cabello, arreglo de barba y estilo en Aures II, Medellín. Reserva tu cita en línea."
    />
    <meta name="twitter:image" content="__SITE_URL__/logo.jpg" />

    <!-- Datos estructurados: negocio local (Google Maps / resultados enriquecidos) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BarberShop",
        "@id": "__SITE_URL__/#barbershop",
        "name": "Barber Creiizii",
        "description": "Barbería premium en Medellín. Cortes de cabello, arreglo de barba y estilo para caballeros.",
        "url": "__SITE_URL__/",
        "image": "__SITE_URL__/logo.jpg",
        "logo": "__SITE_URL__/icon.png",
        "telephone": "+57 300 628 2601",
        "currenciesAccepted": "COP",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Carrera 95 #88-40, Aures II",
          "addressLocality": "Medellín",
          "addressRegion": "Antioquia",
          "addressCountry": "CO"
        },
        "areaServed": { "@type": "City", "name": "Medellín" },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "10:00",
            "closes": "21:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "10:00",
            "closes": "22:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "12:00",
            "closes": "19:00"
          }
        ],
        "sameAs": ["https://instagram.com/creiizii_barber_shop", "https://wa.me/573006282601"]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
